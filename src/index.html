<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "CCSDS Protocol Viewer",
  "description": "Browser-based viewer, builder and decoder for CCSDS frames: Space Packet, TM and TC SDLP, SDLS and SDLS Extended Procedures. Built from the Blue Books.",
  "url": "https://openspacecode.github.io/CCSDS-Viewer/",
  "applicationCategory": "DeveloperApplication",
  "operatingSystem": "Any, in a web browser",
  "browserRequirements": "Requires JavaScript",
  "isAccessibleForFree": true,
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "license": "https://www.apache.org/licenses/LICENSE-2.0",
  "sameAs": "https://github.com/OpenSpaceCode/CCSDS-Viewer",
  "author": {
    "@type": "Organization",
    "name": "OpenSpaceCode",
    "url": "https://github.com/OpenSpaceCode"
  },
  "featureList": [
    "Frame diagrams and field reference pages linked to the Blue Books",
    "Frame Builder for Space Packets and TM and TC Transfer Frames",
    "Frame Decoder with consistency checks and CRC verification",

    "Mission profiles, exported and imported as JSON",
    "Printable one-page cheat sheet per protocol"
  ]

<!-- The loader puts this template on the page before dc-runtime can hide it, and the browser may paint it in between. -->
<style>x-dc{display:none}</style>
<script src="asset:runtime/dc-runtime.js"></script>

</head>
<body>
<x-dc>
<helmet>
<style><!--#include styles/design-system.css --></style>
<script src="asset:runtime/design-system.js"></script>
<style>
html,body{margin:0;padding:0;background:var(--color-bg);color:var(--color-text)}
a{color:var(--color-accent-700)}
a:hover{color:var(--color-accent-900)}
[role="button"]:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
@keyframes tipfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</helmet>

<div data-print-root="1" style="display:flex;height:100vh;overflow:hidden;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)">

  <!--#include views/sidebar.html -->

  <!-- ============ MAIN ============ -->
  <div data-print-main="1" ref="{{ mainRef }}" sc-camel-on-scroll="{{ clearTip }}" style="flex:1;min-width:0;overflow:auto;position:relative">
    <div data-print-pad="1" style="max-width:1220px;margin:0 auto;padding:40px 46px 72px">

      <!--#include views/profile-bar.html -->

      <!--#include views/tm-diagram.html -->

      <!--#include views/spp-diagram.html -->

      <!--#include views/tc-diagram.html -->

      <!--#include views/sdls-diagram.html -->

      <!--#include views/builder.html -->

      <!--#include views/decoder.html -->

      <!--#include views/ep-diagram.html -->

      <!--#include views/field-page.html -->

      <!--#include views/profile.html -->

      <!--#include views/cheat.html -->
    </div>

    <!--#include views/tooltip.html -->

    <!--#include views/search.html -->
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{
  &quot;startExpanded&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Diagram&quot; },
  &quot;hatchOptional&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Diagram&quot; },

}">
