    <!-- ============ FIELD SEARCH (Ctrl+K) ============ -->
    <sc-if value="{{ qOpen }}" hint-placeholder-val="{{ false }}">
      <div sc-camel-on-mouse-down="{{ qBackdrop }}" style="position:fixed;inset:0;z-index:100;display:flex;justify-content:center;align-items:flex-start;padding:9vh 16px 16px;background:color-mix(in srgb, var(--color-neutral-900) 45%, transparent)">
        <div role="dialog" aria-modal="true" aria-label="Search all fields" style="width:min(720px,100%);max-height:78vh;display:flex;flex-direction:column;background:var(--color-bg);border:1px solid var(--color-text);box-shadow:var(--shadow-lg)">
          <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--color-divider)">
            <svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="var(--color-neutral-600)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            <input type="text" ref="{{ qInputRef }}" spellcheck="false" autocomplete="off" aria-label="Search all fields" value="{{ qText }}" placeholder="Field, abbreviation, value or § — FHP, APID, 0x7FE, 4.1.2.7" sc-camel-on-change="{{ qOnInput }}" sc-camel-on-input="{{ qOnInput }}" sc-camel-on-key-down="{{ qOnKey }}" style="flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--color-text);font-family:var(--font-body);font-size:16px;padding:4px 0">
            <span style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.06em;padding:2px 6px;border:1px solid var(--color-divider);color:var(--color-neutral-600)">ESC</span>
          </div>
          <sc-if value="{{ qHasResults }}" hint-placeholder-val="{{ false }}">
            <div role="listbox" aria-label="Search results" style="overflow-y:auto;min-height:0">
              <sc-for list="{{ qResults }}" as="r" hint-placeholder-count="5">
                <div role="option" aria-selected="{{ r.active }}" data-qactive="{{ r.active }}" sc-camel-on-click="{{ r.onClick }}" style="{{ r.style }}" style-hover="background:color-mix(in srgb, var(--color-accent) 8%, transparent)">
                  <div style="display:flex;align-items:baseline;gap:8px">
                    <span style="font-size:14px;font-weight:500;line-height:1.3">{{ r.name }}</span>
                    <sc-if value="{{ r.hasAbbr }}" hint-placeholder-val="{{ false }}"><span style="font-family:var(--font-heading);font-weight:600;font-size:11px;letter-spacing:.06em;color:var(--color-accent-700)">{{ r.abbr }}</span></sc-if>
                    <span style="margin-left:auto;flex:none;font-size:10px;letter-spacing:.1em;font-weight:600;padding:2px 7px;border:1px solid var(--color-divider);color:var(--color-neutral-700);white-space:nowrap">{{ r.label }}</span>
                  </div>
                  <div style="font-size:10.5px;letter-spacing:.06em;color:var(--color-neutral-600);padding-top:2px">{{ r.meta }}</div>
                  <sc-if value="{{ r.hasHit }}" hint-placeholder-val="{{ false }}"><div style="display:flex;gap:8px;align-items:baseline;padding-top:4px;font-size:12px;line-height:1.45"><span style="flex:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;font-weight:600;color:var(--color-accent-800)">{{ r.hitCode }}</span><span style="color:var(--color-neutral-800)">{{ r.hitDesc }}</span></div></sc-if>
                  <sc-if value="{{ r.noHit }}" hint-placeholder-val="{{ true }}"><div style="padding-top:3px;font-size:12px;line-height:1.45;color:var(--color-neutral-700);overflow:hidden;white-space:nowrap;text-overflow:ellipsis">{{ r.desc }}</div></sc-if>
                </div>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ qShowMessage }}" hint-placeholder-val="{{ true }}">
            <div style="padding:22px 16px;font-size:13px;line-height:1.6;color:var(--color-neutral-600)">{{ qMessage }}</div>
          </sc-if>
          <div style="display:flex;gap:16px;padding:8px 16px;border-top:1px solid var(--color-divider);font-size:10.5px;letter-spacing:.06em;color:var(--color-neutral-600)">
            <span><b style="color:var(--color-text);font-weight:600">↑ ↓</b> choose</span>
            <span><b style="color:var(--color-text);font-weight:600">ENTER</b> open</span>
            <span style="margin-left:auto">{{ qCount }}</span>
          </div>
        </div>
      </div>
    </sc-if>
