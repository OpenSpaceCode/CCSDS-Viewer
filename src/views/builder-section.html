                <div style="margin-top:22px;border-top:1px solid var(--color-text);padding-top:13px">
                  <div style="display:flex;align-items:baseline;gap:10px">
                    <span style="font-family:var(--font-heading);font-weight:600;font-size:13px;letter-spacing:.18em;flex:1;line-height:1.25">{{ sec.name }}</span>
                    <sc-if value="{{ sec.on }}" hint-placeholder-val="{{ true }}">
                      <span style="font-size:9.5px;letter-spacing:.14em;font-weight:600;padding:3px 7px;border:1px solid var(--color-accent);color:var(--color-accent-900);background:color-mix(in srgb, var(--color-accent) 14%, transparent);white-space:nowrap">PRESENT</span>
                    </sc-if>
                    <sc-if value="{{ sec.off }}" hint-placeholder-val="{{ false }}">
                      <span style="font-size:9.5px;letter-spacing:.14em;font-weight:600;padding:3px 7px;border:1px solid var(--color-divider);color:var(--color-neutral-600);white-space:nowrap">ABSENT</span>
                    </sc-if>
                  </div>
                  <div style="display:flex;gap:10px;align-items:baseline;padding-top:6px">
                    <span style="font-size:10px;letter-spacing:.13em;font-weight:600;color:var(--color-accent-700);line-height:1.3">{{ sec.form }}</span>
                    <span style="font-size:10px;letter-spacing:.1em;color:var(--color-neutral-600);margin-left:auto;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap">{{ sec.len }}</span>
                  </div>
                  <p style="margin:9px 0 0;font-size:11.5px;line-height:1.6;color:var(--color-neutral-600);text-wrap:pretty">{{ sec.note }}</p>
                </div>
                <sc-for list="{{ sec.list }}" as="f" hint-placeholder-count="3">
                  <div style="display:flex;flex-direction:column;gap:5px;padding:11px 0;border-top:1px solid var(--color-divider);margin-top:11px">
                    <div style="display:flex;align-items:baseline;gap:8px">
                      <span style="width:12px;height:12px;flex:none;border:1px solid var(--color-text);background:{{ f.swatch }}"></span>
                      <span style="font-size:12.5px;font-weight:500;line-height:1.3;flex:1">{{ f.n }}</span>
                      <span style="font-size:10px;letter-spacing:.09em;color:var(--color-neutral-600);font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap">{{ f.bitsLabel }}</span>
                    </div>
                    <sc-if value="{{ f.hasOct }}" hint-placeholder-val="{{ true }}">
                      <div style="display:flex;gap:7px;align-items:center;padding-left:17px">
                        <span style="font-size:10.5px;letter-spacing:.1em;color:var(--color-neutral-600)">LENGTH</span>
                        <sc-raw-select data-boct="{{ f.id }}" value="{{ f.oct }}" sc-camel-on-change="{{ f.onOct }}" style="font-family:var(--font-body);font-size:12px;padding:5px 7px;border:1px solid var(--color-divider);background:var(--color-bg);color:var(--color-text)">
                          <sc-for list="{{ f.octOpts }}" as="o" hint-placeholder-count="3">
                            <option value="{{ o.v }}">{{ o.l }}</option>
                          </sc-for>
                        </sc-raw-select>
                      </div>
                    </sc-if>
                    <div style="display:flex;gap:7px;align-items:center;padding-left:17px">
                      <sc-if value="{{ f.isEnum }}" hint-placeholder-val="{{ false }}">
                        <sc-raw-select data-bfield="{{ f.id }}" value="{{ f.value }}" sc-camel-on-change="{{ f.onChange }}" style="flex:1;min-width:0;font-family:var(--font-body);font-size:12.5px;padding:6px 8px;border:1px solid var(--color-divider);background:var(--color-bg);color:var(--color-text)">
                          <sc-for list="{{ f.opts }}" as="o" hint-placeholder-count="2">
                            <option value="{{ o.v }}">{{ o.l }}</option>
                          </sc-for>
                        </sc-raw-select>
                      </sc-if>
                      <sc-if value="{{ f.isNum }}" hint-placeholder-val="{{ false }}">
                        <input type="number" min="0" max="{{ f.max }}" data-bfield="{{ f.id }}" value="{{ f.value }}" sc-camel-on-change="{{ f.onChange }}" sc-camel-on-input="{{ f.onChange }}" style="width:104px;flex:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;padding:6px 8px;border:1px solid var(--color-divider);background:var(--color-bg);color:var(--color-text)">
                        <span style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.04em;color:var(--color-neutral-600);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ f.binLabel }}</span>
                      </sc-if>
                      <sc-if value="{{ f.isHex }}" hint-placeholder-val="{{ true }}">
                        <span style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--color-neutral-600)">0x</span>
                        <input type="text" spellcheck="false" autocomplete="off" data-bfield="{{ f.id }}" value="{{ f.value }}" sc-camel-on-change="{{ f.onChange }}" sc-camel-on-input="{{ f.onChange }}" placeholder="{{ f.hexPlaceholder }}" style="flex:1;min-width:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;letter-spacing:.08em;padding:6px 8px;border:1px solid var(--color-divider);background:var(--color-bg);color:var(--color-text)">
                      </sc-if>
                      <sc-if value="{{ f.isDerived }}" hint-placeholder-val="{{ false }}">
                        <span data-bderived="{{ f.id }}" style="width:104px;flex:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;padding:6px 8px;border:1px dashed var(--color-neutral-500);color:var(--color-neutral-700);background:var(--color-surface)">{{ f.derivedLabel }}</span>
                        <span style="font-size:10.5px;letter-spacing:.06em;color:var(--color-neutral-600)">derived · {{ f.derivedNote }}</span>
                      </sc-if>
                      <sc-if value="{{ f.canOverride }}" hint-placeholder-val="{{ false }}">
                        <span role="button" tabindex="0" sc-camel-on-click="{{ f.onOverride }}" style="margin-left:auto;font-size:10.5px;letter-spacing:.1em;font-weight:600;color:var(--color-accent-700);cursor:pointer;white-space:nowrap" style-hover="color:var(--color-accent-900)">OVERRIDE</span>
                      </sc-if>
                      <sc-if value="{{ f.isOverridden }}" hint-placeholder-val="{{ false }}">
                        <span role="button" tabindex="0" sc-camel-on-click="{{ f.onDerive }}" style="margin-left:auto;font-size:10.5px;letter-spacing:.1em;font-weight:600;color:var(--color-accent-700);cursor:pointer;white-space:nowrap" style-hover="color:var(--color-accent-900)">USE DERIVED</span>
                      </sc-if>
                    </div>
                    <sc-if value="{{ f.over }}" hint-placeholder-val="{{ false }}">
                      <div style="padding-left:17px;font-size:11px;color:var(--color-accent-900)">{{ f.overMsg }}</div>
                    </sc-if>
                  </div>
                </sc-for>
