      <!-- ============ MANUAL / MISSION PROFILE SWITCH ============ -->
      <sc-if value="{{ pBarShow }}" hint-placeholder-val="{{ false }}">
        <div data-profile-bar="1" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:12px;border-bottom:1px solid var(--color-divider)">
          <span style="font-size:10px;letter-spacing:.18em;color:var(--color-neutral-600)">MANAGED PARAMETERS</span>
          <div style="display:flex;padding-left:1px">
            <div role="button" tabindex="0" data-pmode="manual" sc-camel-on-click="{{ pBarManual }}" style="{{ pManualStyle }}">Manual</div>
            <div role="button" tabindex="0" data-pmode="profile" sc-camel-on-click="{{ pBarProfile }}" style="{{ pProfileStyle }}" title="{{ pBarLabel }}">{{ pBarLabel }}</div>
          </div>
          <sc-if value="{{ pNone }}" hint-placeholder-val="{{ false }}">
            <span role="button" tabindex="0" sc-camel-on-click="{{ pOpen }}" style="font-size:10.5px;letter-spacing:.1em;font-weight:600;color:var(--color-accent-700);cursor:pointer" style-hover="color:var(--color-accent-900)">DEFINE A PROFILE</span>
          </sc-if>
          <span style="font-size:11px;color:var(--color-neutral-600)">{{ pBarNote }}</span>
        </div>
      </sc-if>
